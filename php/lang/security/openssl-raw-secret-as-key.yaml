rules:
- id: openssl-raw-secret-as-key
  patterns:
  - pattern-either:
    - pattern: openssl_encrypt($DATA, $ALGO, $KEY, ...)
    - pattern: openssl_decrypt($DATA, $ALGO, $KEY, ...)
  - metavariable-regex:
      metavariable: $KEY
      regex: (?i)^\$(this->)?\w*(secret|passw(or)?d|passphrase|pwd)\w*$
  - metavariable-regex:
      metavariable: $ALGO
      regex: (?i)^(["'](aes|aria|camellia|sm4|chacha20)[^"']*["']|(self|static)::\w+|\$\w+)$
  message: >-
    '$KEY' is a secret or password string that is passed directly to OpenSSL as the
    raw cipher key. OpenSSL silently truncates or zero-pads the key to the cipher's key
    length. With a 128-bit cipher such as 'aes-128-gcm', only the first 16 bytes of the
    string are used. For a hex or base64 secret with a known prefix (for example, a
    Laravel 'base64:' APP_KEY), that leaves far fewer bits of entropy than the secret
    appears to have, and the key can be brute-forced. Derive a full-length key with
    hash_hkdf() or sodium_crypto_kdf_derive_from_key() instead. If this is a decrypt
    fallback kept for a legacy format, an attacker can choose that format to downgrade
    the encryption. Remove the fallback, or put it behind an expiry and rotate the
    secret.
  languages:
  - php
  severity: WARNING
  metadata:
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    references:
    - https://www.php.net/manual/en/function.openssl-encrypt.php
    - https://www.php.net/manual/en/function.hash-hkdf.php
    - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    owasp:
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    technology:
    - php
    - openssl
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
